# 머지하기 «전»에 거르는 문지기입니다.
#
# ★ 왜 필요했나 〔2026. 9. 2.〕
#
#   이 저장소는 main 에 들어가는 순간 라이브로 나갑니다
#   (update-news.yml 의 on:push → 사이트 굽기 → deploy.sh → Cloudflare Pages).
#   그런데 검사는 «머지된 뒤»에야 돌았습니다. 그래서 잘못 머지하면
#   빌드가 거기서 멈추고, 사이트는 직전 정상본을 유지한 채
#   「커밋은 됐는데 반영이 안 된」 상태로 조용히 남았습니다.
#   Actions 화면에 빨간 표시가 남지만, 아무도 보지 않게 되는 종류의 실패입니다.
#
#   그래서 배포 때 도는 검사를 «PR 에서 먼저» 돌립니다.
#   여기서 초록이면 머지해도 라이브가 멈추지 않는다는 뜻입니다.
#
# ★ 왜 test.js 만 돌리지 않고 굽기 스크립트를 통째로 부르나
#
#   굽기 스크립트가 곧 «실제 관문»이기 때문입니다. 그 안에는 앱별 유닛 검사만이
#   아니라 인증키 유출 검사, 외부 자원 호출 검사, 링크 검사가 함께 있습니다.
#   PR 용으로 검사 목록을 따로 만들면 반드시 배포 쪽과 갈라집니다.
#   두 벌로 만들지 않고 같은 것을 부릅니다.

name: PR 검사

on:
  pull_request:
    branches: [main]
  # 손으로도 돌려볼 수 있게 둡니다.
  workflow_dispatch:

# 같은 PR 에 새로 밀어 넣으면 앞의 검사는 멈춥니다 (러너를 아낍니다).
concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 검사와 굽기
    runs-on: ubuntu-latest
    steps:
      - name: 코드 받기
        uses: actions/checkout@v5

      - name: Node 준비
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: 검사와 굽기 (배포 때와 같은 것)
        run: |
          chmod +x "./사이트 굽기.command"
          bash "./사이트 굽기.command"

      - name: 굽고 나서 원본이 바뀌지 않았는지
        # 굽기는 «사본»을 만드는 일입니다. 원본(추적 중인 파일)이 함께 바뀌었다면
        # 손으로 고쳐야 할 것을 스크립트가 대신 고친 것이므로, 그대로 커밋해야 합니다.
        run: |
          if [ -n "$(git status --porcelain -- . ':!배포')" ]; then
            echo "::warning::굽기 뒤 추적 파일이 바뀌었습니다. 아래 변경을 커밋에 포함해 주세요."
            git status --porcelain -- . ':!배포'
          fi
