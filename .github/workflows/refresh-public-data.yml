# 언제 무엇을 받을지 정하고, 본체(refresh-core.yml)를 부릅니다.
#
# ★ 〔2026. 9. 2.〕 왜 두 번 부르는지.
#
#   국내 공공데이터 서버가 깃허브 러너의 IP 를 이따금 통째로 막습니다.
#   부르는 소리 자체를 무시하므로 10초를 기다리다 `fetch failed` 로 끝납니다.
#   같은 러너 안에서 다시 물어도 IP 가 그대로라 소용이 없습니다.
#
#   그래서 1차에서 닿지 못한 것만 골라 2차를 새 job 으로 엽니다. job 이 새로
#   열리면 러너도 IP 도 바뀌므로 대개 그때는 됩니다. 그래도 안 되면 실패로
#   끝내지 않고 경고만 남깁니다 — 우리가 고칠 수 있는 일이 아닌데 매달
#   「Run failed」 메일을 보내 봐야 아무도 보지 않게 될 뿐입니다.
#   대신 자료는 낡은 채로 남으므로 Actions 화면의 경고로 확인합니다.

name: 공공데이터 정기 확인 및 갱신

on:
  schedule:
    # UTC 기준. 한국시간으로 매월 2일 06:10에 KOSIS 개정 여부를 확인합니다.
    - cron: '10 21 1 * *'
    # 한국시간 1·4·7·10월 2일 06:40에 학교·유치원 자료를 확인합니다.
    - cron: '40 21 1 1,4,7,10 *'
    # 교육통계는 해마다 8월말~9월에 새 조사연도가 나옵니다. 한국시간 9월 5일 07:10.
    - cron: '10 22 4 9 *'
  workflow_dispatch:
    inputs:
      dataset:
        description: 갱신할 공개자료
        required: true
        default: all
        type: choice
        options:
          - all
          - kosis
          - schools
          - kinder
          - edss
          - edss-dry
          - edss-probe
          - edss-crosscheck
      edss_only:
        description: 'EDSS 한 개만 확인할 때의 이름 (비우면 전부)'
        required: false
        type: string
      edss_url:
        description: 'EDSS 요청주소를 파일에 적지 않고 한 번만 시험할 때 (edss_only 와 함께)'
        required: false
        type: string

jobs:
  # 1차 — 예정대로 받아 봅니다.
  #
  # 일정(cron)을 자료 이름으로 바꾸는 자리가 여기 한 곳입니다. 예전에는 이
  # 판단이 스텝마다 `if: github.event.schedule == ...` 로 흩어져 있어서,
  # 2차에게 「이것만 다시」라고 이를 방법이 없었습니다.
  first:
    permissions:
      contents: write
    uses: ./.github/workflows/refresh-core.yml
    secrets: inherit
    with:
      round: '1차'
      edss_only: ${{ inputs.edss_only }}
      edss_url: ${{ inputs.edss_url }}
      datasets: >-
        ${{ inputs.dataset == 'all' && 'kosis schools kinder edss'
         || inputs.dataset != '' && inputs.dataset
         || github.event.schedule == '10 21 1 * *' && 'kosis'
         || github.event.schedule == '40 21 1 1,4,7,10 *' && 'schools kinder edss'
         || github.event.schedule == '10 22 4 9 *' && 'edss'
         || '' }}

  # 2차 — 1차에서 «닿지 못한 것»만, 새 러너에서.
  # 1차가 다 받았으면 이 job 은 아예 열리지 않습니다.
  second:
    permissions:
      contents: write
    needs: first
    if: needs.first.outputs.blocked != ''
    uses: ./.github/workflows/refresh-core.yml
    secrets: inherit
    with:
      round: '2차 (새 러너)'
      datasets: ${{ needs.first.outputs.blocked }}
      edss_only: ${{ inputs.edss_only }}
      edss_url: ${{ inputs.edss_url }}

  # 두 번을 하고도 안 됐으면 여기 한 줄로 남깁니다. 실패로는 치지 않습니다.
  wrapup:
    needs: [first, second]
    if: always() && needs.first.outputs.blocked != ''
    runs-on: ubuntu-latest
    steps:
      - name: 아직도 닿지 못한 것
        # 셸 변수 이름과 값은 env 로 건넵니다. 따옴표 사고를 막습니다.
        env:
          STILL_BLOCKED: ${{ needs.second.outputs.blocked }}
          FIRST_BLOCKED: ${{ needs.first.outputs.blocked }}
        run: |
          if [ -n "$STILL_BLOCKED" ]; then
            echo "::warning::두 러너 모두에서 닿지 못했습니다: $STILL_BLOCKED"
            echo "  자료는 지금 있는 것을 그대로 두었습니다. 잠시 뒤 이 워크플로를 손으로 한 번 더 돌려 보세요."
          else
            echo "::notice::1차에서 막혔던 '$FIRST_BLOCKED' 를 2차에서 받았습니다."
          fi
