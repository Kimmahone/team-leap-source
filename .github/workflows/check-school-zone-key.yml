name: 학구도 API 인증 확인

on:
  push:
    branches: [diagnostic/school-zone-api-check]
    paths: [.github/workflows/check-school-zone-key.yml]
  workflow_dispatch:

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: 인증 및 응답 구조 확인 (키와 원문 응답 비공개)
        env:
          SCHOOL_ZONE_API_KEY: ${{ secrets.SCHOOL_ZONE_API_KEY }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          async function main() {
            let key = (process.env.SCHOOL_ZONE_API_KEY || '').trim();
            if (!key) throw new Error('KEY_MISSING');
            // 포털에서 URL 인코딩된 키를 복사한 경우 헤더용 원문으로 복원합니다.
            if (/%[0-9a-f]{2}/i.test(key)) key = decodeURIComponent(key);
            const response = await fetch('https://api.odcloud.kr/api/15159266/v1/uddi:051f35fc-5e03-4e77-a49f-e3577dbb8e03?page=1&perPage=1&returnType=JSON', {
              headers: { Authorization: `Infuser ${key}`, Accept: 'application/json' },
              signal: AbortSignal.timeout(30000), redirect: 'error'
            });
            console.log(`HTTP status: ${response.status}`);
            if (!response.ok) throw new Error('HTTP_FAILURE');
            const body = await response.json();
            const row = body.data?.[0];
            if (!row || !['학교ID', '학교명', '학구ID'].every(field => Object.hasOwn(row, field))) throw new Error('SCHEMA_FAILURE');
            console.log('PASS: 인증 성공 및 학교·학구 응답 구조 확인');
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '## 학구도 API 인증 성공\n\nHTTP 200 및 학교ID·학교명·학구ID 항목을 확인했습니다. 키와 응답 원문은 출력하지 않았습니다.\n\n이 검사는 인증 확인이며, 초등학교→중학교 배정 관계의 완전성을 검증하지는 않습니다.\n');
          }
          main().catch(error => {
            const safe = ['KEY_MISSING', 'HTTP_FAILURE', 'SCHEMA_FAILURE'].includes(error.message) ? error.message : 'REQUEST_FAILED';
            console.error(`FAIL: ${safe} (보안을 위해 원문 오류는 생략합니다)`);
            process.exitCode = 1;
          });
          NODE
