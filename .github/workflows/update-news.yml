name: 주간 뉴스 받아오기 및 자동 배포

# ★ 이 워크플로가 하는 일 〔2026. 8. 17.〕
#
#   1. 네이버에서 학령인구·소규모학교 기사를 받아 news-history.json 에 반영 및 커밋.
#   2. 사이트 굽기(각종 보안·링크·유닛 테스트 검사 포함) 실행하여 배포본 빌드.
#   3. DEPLOY_PAT 시크릿을 사용해 team-leap 배포 저장소로 자동 푸시 (Cloudflare Pages 라이브 반영).
#
#   필요 시크릿 (저장소 Settings → Secrets and variables → Actions):
#     - NAVER_CLIENT_ID
#     - NAVER_CLIENT_SECRET
#     - DEPLOY_PAT (team-leap 저장소 푸시 권한이 있는 GitHub Personal Access Token)

on:
  push:
    branches: [main]
    # 주간 작업이 news-history.json만 커밋한 경우 같은 작업이 연달아 다시 돌지 않게 합니다.
    paths-ignore:
      - news-history.json
  schedule:
    # 한국시간 월요일 아침 7시 (UTC 일요일 22시). 주간 클리핑이라 매일 돌 까닭이 없습니다.
    - cron: '0 22 * * 0'
  workflow_dispatch:

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v5

      - name: Node.js 설정
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      # ★ 〔2026. 8. 31.〕 이 단계에 if 가 없었습니다.
      #   그래서 main 에 push 될 때마다 뉴스를 새로 받았습니다. 하루에 서른 번
      #   밀어 넣은 날, 히스토리 창이 17일치에서 8일치로 줄었습니다 —
      #   새 기사가 들어올 때마다 오래된 기사가 뒤로 밀려 사라졌기 때문입니다.
      #   밀려난 것은 아무 데도 남지 않아 커밋 기록에서 되살려야 했습니다.
      #
      #   push 때 필요한 것은 «배포»이지 «수집»이 아닙니다. 주간 일정과
      #   손으로 돌릴 때만 받아옵니다. 아래 배포 단계는 그대로 매번 돕니다.
      - name: 뉴스 받아오기
        if: github.event_name != 'push'
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: node fetch-news.js

      - name: 변경된 뉴스 커밋 (team-leap-source)
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add news-history.json
          if git diff --cached --quiet; then
            echo "새로운 뉴스가 없습니다."
          else
            git commit -m "🤖 주간 뉴스 클리핑"
            git push
            echo "::notice::최신 뉴스를 team-leap-source에 반영했습니다."
          fi

      - name: 사이트 굽기 (빌드 및 검사)
        run: |
          chmod +x "./사이트 굽기.command"
          bash "./사이트 굽기.command"

      - name: 배포 저장소(team-leap)로 자동 푸시
        env:
          DEPLOY_PAT: ${{ secrets.DEPLOY_PAT }}
        run: |
          if [ -z "$DEPLOY_PAT" ]; then
            echo "::warning::DEPLOY_PAT 시크릿이 없어 team-leap 배포 푸시를 건너뜁니다."
            exit 0
          fi

          DEPLOY_DIR=$(mktemp -d)
          git clone "https://x-access-token:${DEPLOY_PAT}@github.com/Kimmahone/team-leap.git" "$DEPLOY_DIR"

          # 기존 배포 파일 제거 (.git 보존)
          find "$DEPLOY_DIR" -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +

          # 새로 구운 파일 복사 (숨김 파일 포함)
          cp -R 배포/site/* "$DEPLOY_DIR"/
          cp -R 배포/site/.[!.]* "$DEPLOY_DIR"/ 2>/dev/null || true

          # Cloudflare Pages Functions는 정적 출력 폴더가 아니라 배포 저장소 루트에 둡니다.
          cp -R functions "$DEPLOY_DIR/functions"

          cd "$DEPLOY_DIR"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "배포 저장소에 변경 사항이 없습니다."
          else
            git commit -m "🚀 사이트 자동 배포 (주간 뉴스 및 업데이트)"
            git push origin main
            echo "::notice::team-leap 저장소로 배포가 성공적으로 완료되었습니다!"
          fi
