name: 뉴스 매일 수집·3일 분석 및 자동 배포

# ★ 이 워크플로가 하는 일 〔2026. 8. 17.〕
#
#   1. 네이버에서 학령인구·소규모학교 기사를 받아 news-history.json 에 반영 및 커밋.
#   2. 사이트 굽기(각종 보안·링크·유닛 테스트 검사 포함) 실행하여 배포본 빌드.
#   3. DEPLOY_PAT 시크릿을 사용해 team-leap 배포 저장소로 자동 푸시 (Cloudflare Pages 라이브 반영).
#
#   필요 시크릿 (저장소 Settings → Secrets and variables → Actions):
#     - NAVER_CLIENT_ID
#     - NAVER_CLIENT_SECRET
#     - DEPLOY_PAT (team-leap 저장소 푸시 권한이 있는 GitHub Personal Access Token)

on:
  push:
    branches: [main]
    # 자동 생성 파일만 커밋한 경우 같은 작업이 연달아 다시 돌지 않게 합니다.
    paths-ignore:
      - news-history.json
      - '06. 실행계획(1)/prototype/assets/news/snapshot.json'
      - '06. 실행계획(1)/prototype/assets/news/snapshots/index.json'
      - '06. 실행계획(1)/prototype/assets/news/issues/index.json'
  schedule:
    # 한국시간 **매일** 아침 7시 (UTC 22시).
    #
    # ★ 〔2026. 9. 7.〕 주 1회(일요일 22시 UTC)에서 매일로 올렸습니다.
    #
    #   왜 올렸나 — 주 1회는 «이미 놓치고 있었습니다».
    #     검색어마다 최신 30건만 받아옵니다(display=30&sort=date).
    #     일주일 사이에 그 검색어로 31건이 넘게 나오면 넘친 것은 영영 못 받습니다.
    #     다음 회차에는 이미 창 밖으로 밀려나 있기 때문입니다.
    #     걸러진 뒤에도 하루 4~5건씩 쌓이는 것을 보면 원본은 그보다 훨씬 많습니다.
    #
    #   그리고 일정은 «정시에 안 돕니다». 공용 러너가 붐비면 밀립니다 —
    #     실제로 16분·17분·2시간 10분 밀렸고 8/16 회차는 실패했습니다.
    #     자주 돌면 한 번 걸러도 다음 회차가 하루 뒤에 옵니다.
    #
    #   자료가 망가지지 않나 — 안 망가집니다.
    #     예전에는 위험했습니다. 히스토리를 «건수»(60건)로 잘라서, 하루에
    #     서른 번 밀어 넣은 날 창이 17일치에서 8일치로 줄었습니다.
    #     8월 31일에 «날짜»(HISTORY_DAYS=120)로 바꿨으므로 몇 번을 돌리든
    #     120일 창은 그대로입니다.
    #
    #   요금은 — 안 납니다.
    #     최근 30일 Actions 실행 100회 · 총 100.4분. 비공개 저장소 무료 한도가
    #     월 2,000분이므로 5% 입니다. 매일로 올려도 약 126분(6.3%).
    #     네이버 검색 API 는 한 번에 3회 부르므로 하루 3회 —
    #     한도 25,000회/일의 0.012% 입니다.
    #
    #   ⚠️ 사이트가 매일 배포됩니다. 검사를 통과해야만 나가므로 위험하지는
    #     않지만, 배포 이력에 봇 변경이 매일 쌓입니다.
    #     거슬리면 요일 지정으로 줄이세요 — 예: '37 22 * * 0,2,4' (월·수·금).
    #     ※ '*/3' 은 「3일마다」가 «아닙니다» — 매달 1·4·7…31일이라
    #        달이 바뀌면 간격이 1~2일로 찌그러집니다.
    #
    # ★★ 분을 «37» 로 둔 까닭 〔2026. 9. 7.〕 — 정각을 피합니다.
    #
    #   9월 6일 22:00(UTC) 회차가 «통째로 사라졌습니다». 지연도 실패도 아니고
    #   실행 자체가 만들어지지 않았습니다 — 기록도, 오류도, 알림도 없습니다.
    #   워크플로는 active 였고 대기·취소된 것도 없었습니다.
    #
    #   GitHub 은 부하가 높으면 예약 실행을 미루거나 «버립니다». 그리고 문서가
    #   드는 대표적 고부하 시각이 «매시 정각» 입니다. 우리는 딱 정각이었습니다.
    #
    #   이 저장소 기록이 그대로 보여 줍니다 — 제때 돈 적이 한 번도 없습니다.
    #     08-16 22:16 (16분 늦고 «실패»)
    #     08-23 22:17 (17분 늦음)
    #     08-31 00:10 (130분 늦음)
    #     09-06 ──── (아예 사라짐)
    #
    #   그래서 붐비는 구간을 비켜 갑니다. 07:37(한국) 로 옮깁니다.
    #   **이 «37» 을 0 으로 되돌리지 마세요.** 보기 좋으라고 있는 값이 아닙니다.
    #
    #   ※ 그래도 GitHub 일정은 «약속»이 아니라 «자격»입니다. 언제든 또 빠질 수
    #     있습니다. 그래서 빠졌을 때 «화면이 스스로 말하도록» 해 두었습니다 —
    #     대시보드 뉴스 카드가 며칠째 새 기사가 없는지 적습니다.
    - cron: '37 22 * * *'
  workflow_dispatch:

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v5

      - name: Node.js 설정
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      # ★ 〔2026. 8. 31.〕 이 단계에 if 가 없었습니다.
      #   그래서 main 에 push 될 때마다 뉴스를 새로 받았습니다. 하루에 서른 번
      #   밀어 넣은 날, 히스토리 창이 17일치에서 8일치로 줄었습니다 —
      #   새 기사가 들어올 때마다 오래된 기사가 뒤로 밀려 사라졌기 때문입니다.
      #   밀려난 것은 아무 데도 남지 않아 커밋 기록에서 되살려야 했습니다.
      #
      #   push 때 필요한 것은 «배포»이지 «수집»이 아닙니다. 매일 일정과
      #   손으로 돌릴 때만 받아옵니다. 아래 배포 단계는 그대로 매번 돕니다.
      - name: 뉴스 받아오기
        if: github.event_name != 'push'
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: node fetch-news.js

      # 수집은 매일, 이슈 분석과 이슈페이퍼는 마지막 성공일로부터 3일 뒤 생성합니다.
      # 매일 검사하므로 예약이 누락돼도 다음 날 보충하고 월말에도 간격이 깨지지 않습니다.
      # workflow_dispatch는 현재 자료로 같은 기준일 결과를 강제로 갱신합니다.
      - name: 3일 이슈 분석 및 이슈페이퍼 생성
        if: github.event_name != 'push'
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            node news-pipeline/build-news-insights.mjs --force
          else
            node news-pipeline/build-news-insights.mjs
          fi

      - name: 변경된 뉴스 커밋 (team-leap-source)
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add news-history.json \
            "06. 실행계획(1)/prototype/assets/news/snapshot.json" \
            "06. 실행계획(1)/prototype/assets/news/snapshots/index.json" \
            "06. 실행계획(1)/prototype/assets/news/issues/index.json"
          if git diff --cached --quiet; then
            echo "새로운 뉴스가 없습니다."
          else
            git commit -m "🤖 뉴스 수집 및 3일 이슈 분석"
            git push
            echo "::notice::최신 뉴스를 team-leap-source에 반영했습니다."
          fi

      - name: 사이트 굽기 (빌드 및 검사)
        run: |
          chmod +x "./사이트 굽기.command"
          bash "./사이트 굽기.command"

      - name: 배포 저장소(team-leap)로 자동 푸시
        env:
          DEPLOY_PAT: ${{ secrets.DEPLOY_PAT }}
        run: bash .github/deploy.sh "사이트 자동 배포 (뉴스 수집 및 3일 이슈 분석)"
